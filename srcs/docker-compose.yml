secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    volumes:
      - mariadb_vol:/var/lib/mysql
    restart: always
    env_file:
      - ./.env
    networks:
      - inception
    secrets:
      - db_root_password
      - db_password

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    volumes:
      - wordpress_vol:/var/www/html
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./.env
    networks:
      - inception
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_vol:/var/www/html
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception
networks:
  inception:
    driver: bridge

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ybarakat/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ybarakat/data/wordpress
